name: Actualizar datos de OpenStreetMap
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/osm.py
      - run: |
          git config user.name "nido-bot"
          git config user.email "nido-bot@users.noreply.github.com"
          git add data/osm.json
          git diff --cached --quiet || (git commit -m "Datos OSM $(date +%F)" && git push)
